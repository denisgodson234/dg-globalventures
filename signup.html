<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Denis Godson Global Ventures</title>

<meta name="description" content="Create your Denis Godson Global Ventures account.">

<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo-area">

<img src="logo.png" alt="Logo">

<h2>DG Global Ventures</h2>

</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="login.html">Login</a></li>

</ul>

</nav>

</header>

<section class="auth-page">

<div class="auth-card">

<img src="logo.png" class="auth-logo" alt="Logo">

<h1>Create Your Account</h1>

<p>
Join Denis Godson Global Ventures and enjoy our premium services.
</p>

<form id="signup-form">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="full-name"
placeholder="Enter your full name"
required>

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="+234..."
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create a password"
required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
id="confirm-password"
placeholder="Confirm your password"
required>

</div>

<button
type="submit"
class="btn primary">

Create Account

</button>

</form>

<p class="auth-link">

Already have an account?

<a href="login.html">

Login here

</a>

</p>

</div>

</section>

<script type="module" src="signup.js"></script>

</body>

</html>

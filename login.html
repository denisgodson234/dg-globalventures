<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Denis Godson Global Ventures</title>

<meta name="description" content="Login to Denis Godson Global Ventures.">

<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo-area">

<img src="logo.png" alt="Logo">

<h2>DG Global Ventures</h2>

</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="signup.html">Sign Up</a></li>

</ul>

</nav>

</header>

<section class="auth-page">

<div class="auth-card">

<img src="logo.png" class="auth-logo" alt="Logo">

<h1>Welcome Back</h1>

<p>

Login to your Denis Godson Global Ventures account.

</p>

<form id="login-form">

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

<label>

<input type="checkbox" id="remember-me">

Remember Me

</label>

<a href="#" id="forgot-password">

Forgot Password?

</a>

</div>

<button
type="submit"
class="btn primary">

Login

</button>

</form>

<p class="auth-link">

Don't have an account?

<a href="signup.html">

Create one here

</a>

</p>

</div>

</section>

<script type="module" src="login.js"></script>

</body>

</html>
